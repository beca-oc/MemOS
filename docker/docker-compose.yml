name: memos-dev

services:
  memos:
    container_name: memos-api-docker
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["uvicorn", "memos.api.server_api:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    depends_on:
      - neo4j
      - qdrant
      - redis
    environment:
      - PYTHONPATH=/app/src
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - NUMEXPR_NUM_THREADS=1
      - EMBEDDING_DIMENSION=768
      - MOS_EMBEDDER_BACKEND=universal_api
      - MOS_EMBEDDER_PROVIDER=openai
      - MOS_EMBEDDER_MODEL=nomic-embed-text-v1.5.Q4_K_M.gguf
      - MOS_EMBEDDER_API_BASE=http://host.docker.internal:8010/v1
      - MOS_EMBEDDER_API_KEY=local-embedder
      - MOS_EMBEDDER_BACKUP_CLIENT=false
      - HF_ENDPOINT=https://hf-mirror.com
      - QDRANT_HOST=qdrant-docker
      - QDRANT_PORT=6333
      - NEO4J_URI=bolt://neo4j-docker:7687
      - MEMSCHEDULER_USE_REDIS_QUEUE=true
      - MEMSCHEDULER_REDIS_HOST=host.docker.internal
      - MEMSCHEDULER_REDIS_PORT=6379
      - MEMSCHEDULER_REDIS_TIMEOUT=5
      - MEMSCHEDULER_REDIS_CONNECT_TIMEOUT=3
      - MOS_SCHEDULER_THREAD_POOL_MAX_WORKERS=4
      - MOS_SCHEDULER_CONSUME_INTERVAL_SECONDS=0.20
      - MOS_SCHEDULER_ENABLE_PARALLEL_DISPATCH=false
    volumes:
      - ../src:/app/src
      - .:/app/docker
    restart: unless-stopped
    cpus: "2.00"
    mem_limit: 2g
    mem_reservation: 1g
    pids_limit: 4096
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - memos_network

  memos-read:
    container_name: memos-read-docker
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["uvicorn", "memos.api.server_api:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    ports:
      - "8001:8000"
    env_file:
      - ../.env
    depends_on:
      - neo4j
      - qdrant
      - redis
    environment:
      - PYTHONPATH=/app/src
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - NUMEXPR_NUM_THREADS=1
      - EMBEDDING_DIMENSION=768
      - MOS_EMBEDDER_BACKEND=universal_api
      - MOS_EMBEDDER_PROVIDER=openai
      - MOS_EMBEDDER_MODEL=nomic-embed-text-v1.5.Q4_K_M.gguf
      - MOS_EMBEDDER_API_BASE=http://host.docker.internal:8010/v1
      - MOS_EMBEDDER_API_KEY=local-embedder
      - MOS_EMBEDDER_BACKUP_CLIENT=false
      - HF_ENDPOINT=https://hf-mirror.com
      - QDRANT_HOST=qdrant-docker
      - QDRANT_PORT=6333
      - NEO4J_URI=bolt://neo4j-docker:7687
      - MEMSCHEDULER_USE_REDIS_QUEUE=false
      - API_SCHEDULER_ON=false
      - MOS_ENABLE_SCHEDULER=false
      - MEMOS_READ_ONLY=true
      - MEMOS_LIGHTWEIGHT_READ_MODE=true
      - ENABLE_CHAT_API=false
      - MOS_SEARCH_DEFAULT_DEDUP=no
      - MOS_SEARCH_ENABLE_RERANK=false
      - MOS_SEARCH_ALLOW_EMBEDDING_RECOMPUTE=false
      - MOS_SEARCH_DEDUP_CANDIDATE_MULTIPLIER=2
      - MOS_SEARCH_DEDUP_CANDIDATE_CAP=24
    volumes:
      - ../src:/app/src
      - .:/app/docker
    restart: unless-stopped
    cpus: "1.00"
    mem_limit: 1g
    mem_reservation: 512m
    pids_limit: 2048
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - memos_network

  redis:
    image: redis:7-alpine
    container_name: redis-docker
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    cpus: "0.50"
    mem_limit: 384m
    mem_reservation: 128m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - memos_network

  neo4j:
    image: neo4j:5.26.4
    container_name: neo4j-docker
    ports:
      - "7474:7474"   # HTTP
      - "7687:7687"   # Bolt
    healthcheck:
      test: wget http://localhost:7474 || exit 1
      interval: 1s
      timeout: 10s
      retries: 20
      start_period: 3s
    environment:
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_AUTH: "neo4j/12345678"
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "768m"
      NEO4J_server_memory_pagecache_size: "512m"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped
    cpus: "2.00"
    mem_limit: 2g
    mem_reservation: 1g
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - memos_network

  qdrant:
    image: qdrant/qdrant:v1.15.3
    container_name: qdrant-docker
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__SERVICE__HTTP_PORT: 6333
    restart: unless-stopped
    cpus: "1.50"
    mem_limit: 1500m
    mem_reservation: 512m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - memos_network

volumes:
  neo4j_data:
  neo4j_logs:
  qdrant_data:
  redis_data:

networks:
  memos_network:
    driver: bridge
